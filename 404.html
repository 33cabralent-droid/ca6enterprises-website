<!DOCTYPE html>
<!-- 404.html: "page not found" page for ca6enterprises.com. Cloudflare Pages serves it, with HTTP status 404, for any path that does not exist. Same dark and gold look as index.html; no scripts. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found | CA6 ENTERPRISES LLC</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #050608; --panel2: #0e1520; --line: rgba(184,197,214,0.14); --text: #f5f5f0; --muted: #a9b4c3; --gold: #c9a84c; --gold2: #e8c96a; --blue: #1a6fc4; --blue2: #2484e8; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; background: radial-gradient(ellipse at 80% 20%, rgba(26,111,196,0.16), transparent 55%), var(--bg); color: var(--text); font-family: 'Source Sans 3', system-ui, sans-serif; font-size: 17px; line-height: 1.65; -webkit-font-smoothing: antialiased; }
    a:focus-visible { outline: 2px solid var(--gold2); outline-offset: 3px; }
    header { border-bottom: 1px solid var(--line); }
    .wrap { max-width: 1160px; margin: 0 auto; padding: 0 28px; width: 100%; }
    .brand { display: flex; align-items: center; gap: 12px; height: 64px; text-decoration: none; color: var(--text); }
    .mark { font-family: 'Playfair Display', serif; font-weight: 900; font-size: 1.05rem; color: var(--bg); background: linear-gradient(135deg, var(--gold2), var(--gold)); width: 40px; height: 40px; display: grid; place-items: center; border-radius: 3px; }
    .brand span { font-weight: 700; letter-spacing: 0.14em; font-size: 0.82rem; }
    main { flex: 1; display: flex; align-items: center; padding: 72px 0; }
    .code { color: var(--gold); text-transform: uppercase; letter-spacing: 0.2em; font-size: 0.74rem; font-weight: 700; margin: 0 0 14px; }
    h1 { font-family: 'Playfair Display', Georgia, serif; font-size: clamp(2.4rem, 5vw, 3.6rem); font-weight: 900; line-height: 1.08; margin: 0 0 20px; }
    .gold { color: var(--gold); }
    p.lead { color: var(--muted); max-width: 34rem; margin: 0 0 30px; }
    .btns { display: flex; gap: 14px; flex-wrap: wrap; }
    .btn { display: inline-block; padding: 13px 26px; font-size: 0.78rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; text-decoration: none; border-radius: 2px; border: 1px solid transparent; }
    .btn-blue { background: var(--blue); color: #fff; }
    .btn-blue:hover { background: var(--blue2); }
    .btn-line { border-color: rgba(245,245,240,0.35); color: var(--text); }
    .btn-line:hover { border-color: var(--gold2); color: var(--gold2); }
    footer { border-top: 1px solid var(--line); padding: 28px 0; color: #7a8fa8; font-size: 0.88rem; }
  </style>
</head>
<body>
  <header>
    <div class="wrap"><a class="brand" href="/"><div class="mark">C6</div><span>CA6 ENTERPRISES LLC</span></a></div>
  </header>
  <main>
    <div class="wrap">
      <p class="code">Error 404</p>
      <h1>Page <span class="gold">not found.</span></h1>
      <p class="lead">The page you asked for is not on this site. It may have moved, or the link may be mistyped.</p>
      <div class="btns">
        <a class="btn btn-blue" href="/">Back to home</a>
        <a class="btn btn-line" href="/#contact">Contact us</a>
      </div>
    </div>
  </main>
  <footer>
    <div class="wrap">&copy; 2026 CA6 ENTERPRISES LLC &middot; Melbourne, Florida</div>
  </footer>
</body>
</html>
